name: zonevision

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zonevision}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-zonevision}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_JSON: ${LOG_JSON:-true}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-zonevision}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-zonevision}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      STORAGE_DIR: /data/storage
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-500}
      MODEL_WEIGHTS: ${MODEL_WEIGHTS:-yolo11n.pt}
      MODEL_AUTO_DOWNLOAD: ${MODEL_AUTO_DOWNLOAD:-true}
      INFERENCE_DEVICE: ${INFERENCE_DEVICE:-auto}
      DEFAULT_CONFIDENCE: ${DEFAULT_CONFIDENCE:-0.35}
      DEFAULT_IMAGE_SIZE: ${DEFAULT_IMAGE_SIZE:-640}
      DEFAULT_TARGET_FPS: ${DEFAULT_TARGET_FPS:-6}
      WORKER_ENABLED: ${WORKER_ENABLED:-true}
    volumes:
      # uploads/, processed/, snapshots/ and models/ live under one named volume
      - storage:/data/storage
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Empty = same origin; nginx proxies /api and /health to the backend.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
  storage:
